<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Painel — Pastel da Vila</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --vermelho: #7B1A1A;
      --amarelo: #F5C518;
      --marrom: #4A2C0A;
      --creme: #FFF8F0;
      --verde: #1a7b3a;
      --azul: #1a4a7b;
      --cinza: #f0f0f0;
      --texto: #2D1A0E;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Nunito', sans-serif; background: #1a1a1a; color: #eee; min-height: 100vh; }

    /* ── LOGIN ── */
    #login-screen {
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh; background: var(--vermelho);
    }
    .login-box {
      background: white; border-radius: 16px; padding: 2.5rem;
      width: min(380px, 90vw); text-align: center;
      box-shadow: 0 20px 60px rgba(0,0,0,0.4);
    }
    .login-box img { height: 90px; margin-bottom: 1rem; }
    .login-box h2 { color: var(--vermelho); font-size: 1.3rem; margin-bottom: 1.5rem; }
    .login-box input {
      width: 100%; padding: 0.8rem 1rem; border: 2px solid #ddd;
      border-radius: 8px; font-size: 1rem; font-family: 'Nunito', sans-serif;
      margin-bottom: 1rem; outline: none;
    }
    .login-box input:focus { border-color: var(--vermelho); }
    .login-box button {
      width: 100%; padding: 0.9rem; background: var(--vermelho); color: white;
      border: none; border-radius: 8px; font-size: 1rem; font-weight: 700;
      cursor: pointer; font-family: 'Nunito', sans-serif;
    }
    .login-box button:hover { background: #9b2c2c; }
    .login-erro { color: #c00; font-size: 0.85rem; margin-top: 0.5rem; }

    /* ── PAINEL ── */
    #painel-screen { display: none; }

    .topbar {
      background: var(--vermelho); padding: 0.8rem 1.5rem;
      display: flex; align-items: center; justify-content: space-between;
      border-bottom: 3px solid var(--amarelo); position: sticky; top: 0; z-index: 100;
    }
    .topbar-brand { display: flex; align-items: center; gap: 0.75rem; }
    .topbar-brand img { height: 44px; }
    .topbar-brand span { color: var(--amarelo); font-weight: 800; font-size: 1.1rem; }
    .topbar-right { display: flex; align-items: center; gap: 1rem; }
    .badge-novo {
      background: var(--amarelo); color: var(--marrom);
      border-radius: 50px; padding: 4px 14px; font-weight: 800; font-size: 0.9rem;
    }
    .btn-sair {
      background: rgba(255,255,255,0.15); border: none; color: white;
      padding: 6px 14px; border-radius: 8px; cursor: pointer;
      font-family: 'Nunito', sans-serif; font-size: 0.85rem;
    }

    .painel-body { padding: 1.5rem; max-width: 1200px; margin: 0 auto; }

    /* ── TABS ── */
    .tabs { display: flex; gap: 0.5rem; margin-bottom: 1.5rem; flex-wrap: wrap; }
    .tab {
      background: #2a2a2a; border: none; color: #aaa;
      padding: 0.6rem 1.4rem; border-radius: 50px; cursor: pointer;
      font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 0.9rem;
      transition: all 0.2s;
    }
    .tab.active { background: var(--amarelo); color: var(--marrom); }

    /* ── CARDS DE PEDIDO ── */
    .pedidos-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 1rem;
    }

    .pedido-card {
      background: #2a2a2a; border-radius: 12px; overflow: hidden;
      border-left: 5px solid #555; transition: all 0.2s;
    }
    .pedido-card.novo     { border-color: var(--amarelo); }
    .pedido-card.preparo  { border-color: #f59e0b; }
    .pedido-card.pronto   { border-color: var(--verde); }
    .pedido-card.entregue { border-color: #555; opacity: 0.6; }

    .card-header {
      padding: 0.8rem 1rem; display: flex; justify-content: space-between;
      align-items: center; border-bottom: 1px solid #3a3a3a;
    }
    .card-id { font-size: 0.75rem; color: #888; }
    .card-hora { font-size: 0.75rem; color: #888; }
    .card-origem {
      font-size: 0.7rem; font-weight: 700; padding: 2px 8px;
      border-radius: 50px; background: #3a3a3a; color: #ccc;
    }
    .card-origem.whatsapp { background: #1a4a2a; color: #4ade80; }

    .card-body { padding: 1rem; }
    .card-cliente { font-weight: 800; font-size: 1rem; margin-bottom: 0.2rem; }
    .card-tel { font-size: 0.82rem; color: #aaa; margin-bottom: 0.75rem; }
    .card-end { font-size: 0.82rem; color: #bbb; margin-bottom: 0.75rem; line-height: 1.4; }

    .card-itens { margin-bottom: 0.75rem; }
    .card-item { font-size: 0.88rem; color: #ddd; padding: 2px 0; }

    .card-total { font-size: 1.1rem; font-weight: 800; color: var(--amarelo); margin-bottom: 0.5rem; }
    .card-pag {
      font-size: 0.78rem; background: #3a3a3a; display: inline-block;
      padding: 2px 10px; border-radius: 50px; color: #ccc; margin-bottom: 0.75rem;
    }

    .card-acoes { display: flex; gap: 0.5rem; flex-wrap: wrap; }
    .btn-status {
      flex: 1; padding: 0.5rem; border: none; border-radius: 8px;
      font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 0.8rem;
      cursor: pointer; transition: all 0.2s;
    }
    .btn-preparo  { background: #f59e0b; color: #1a1a1a; }
    .btn-pronto   { background: var(--verde); color: white; }
    .btn-entregue { background: #555; color: #ddd; }
    .btn-imprimir { background: #1a4a7b; color: white; }
    .btn-status:hover { filter: brightness(1.15); }

    /* ── LANÇAMENTO MANUAL ── */
    .manual-box {
      background: #2a2a2a; border-radius: 12px; padding: 1.5rem; margin-bottom: 1.5rem;
    }
    .manual-box h3 { color: var(--amarelo); margin-bottom: 1rem; font-size: 1rem; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; margin-bottom: 0.75rem; }
    .form-row.full { grid-template-columns: 1fr; }
    .manual-box label { font-size: 0.78rem; color: #aaa; display: block; margin-bottom: 0.3rem; text-transform: uppercase; }
    .manual-box input,
    .manual-box textarea,
    .manual-box select {
      width: 100%; padding: 0.6rem 0.8rem; background: #1a1a1a; border: 1.5px solid #3a3a3a;
      border-radius: 8px; color: #eee; font-family: 'Nunito', sans-serif; font-size: 0.9rem; outline: none;
    }
    .manual-box input:focus,
    .manual-box textarea:focus,
    .manual-box select:focus { border-color: var(--amarelo); }
    .manual-box textarea { resize: vertical; min-height: 80px; }
    .btn-lancar {
      background: var(--amarelo); color: var(--marrom); border: none;
      padding: 0.7rem 2rem; border-radius: 8px; font-weight: 800;
      font-family: 'Nunito', sans-serif; cursor: pointer; font-size: 0.95rem;
    }
    .btn-lancar:hover { background: #d4a017; }

    /* ── VAZIO ── */
    .vazio { text-align: center; color: #555; padding: 3rem; font-size: 1rem; }

    /* ── ALERTA SONORO ── */
    .alerta-banner {
      display: none; position: fixed; top: 70px; left: 50%; transform: translateX(-50%);
      background: var(--amarelo); color: var(--marrom); padding: 0.8rem 2rem;
      border-radius: 50px; font-weight: 800; font-size: 1rem;
      box-shadow: 0 4px 20px rgba(0,0,0,0.4); z-index: 999; animation: pulse 1s infinite;
    }
    @keyframes pulse { 0%,100%{transform:translateX(-50%) scale(1)} 50%{transform:translateX(-50%) scale(1.05)} }

    /* ── IMPRESSÃO ── */
    @media print {
      body * { visibility: hidden; }
      #print-area, #print-area * { visibility: visible; }
      #print-area {
        position: fixed; inset: 0; background: white; color: black;
        font-family: monospace; font-size: 12px; padding: 10px; width: 80mm;
      }
    }
    #print-area { display: none; }

    /* STATUS BADGE */
    .status-badge {
      font-size: 0.7rem; font-weight: 700; padding: 2px 8px;
      border-radius: 50px; display: inline-block;
    }
    .status-novo     { background: #7b5a00; color: var(--amarelo); }
    .status-preparo  { background: #7b4a00; color: #fbbf24; }
    .status-pronto   { background: #1a4a2a; color: #4ade80; }
    .status-entregue { background: #333; color: #888; }
  </style>
</head>
<body>

<!-- ÁREA DE IMPRESSÃO (invisível até imprimir) -->
<div id="print-area"></div>

<!-- ALERTA NOVO PEDIDO -->
<div class="alerta-banner" id="alerta-banner">🔔 Novo pedido chegou!</div>

<!-- LOGIN -->
<div id="login-screen">
  <div class="login-box">
    <img src="images/logo.png" alt="Pastel da Vila" />
    <h2>Painel do Lojista</h2>
    <input type="password" id="senha-input" placeholder="Digite a senha" onkeydown="if(event.key==='Enter')entrar()" />
    <button onclick="entrar()">Entrar</button>
    <p class="login-erro" id="login-erro"></p>
  </div>
</div>

<!-- PAINEL -->
<div id="painel-screen">
  <div class="topbar">
    <div class="topbar-brand">
      <img src="images/logo.png" alt="logo" />
      <span>Painel de Pedidos</span>
    </div>
    <div class="topbar-right">
      <span class="badge-novo" id="badge-novos">0 novos</span>
      <button class="btn-sair" onclick="sair()">Sair</button>
    </div>
  </div>

  <div class="painel-body">

    <!-- LANÇAMENTO MANUAL (WhatsApp) -->
    <div class="manual-box">
      <h3>➕ Lançar Pedido do WhatsApp</h3>
      <div class="form-row">
        <div>
          <label>Nome do Cliente</label>
          <input type="text" id="m-nome" placeholder="Ex: João Silva" />
        </div>
        <div>
          <label>WhatsApp</label>
          <input type="text" id="m-tel" placeholder="(43) 99999-9999" />
        </div>
      </div>
      <div class="form-row full">
        <div>
          <label>Itens do Pedido</label>
          <textarea id="m-itens" placeholder="Ex: 2x Carne, 1x Frango com Catupiry, 1x Chocolate"></textarea>
        </div>
      </div>
      <div class="form-row">
        <div>
          <label>Total (R$)</label>
          <input type="number" id="m-total" placeholder="Ex: 45.00" step="0.01" />
        </div>
        <div>
          <label>Pagamento</label>
          <select id="m-pag">
            <option value="pix">Pix</option>
            <option value="dinheiro">Dinheiro</option>
            <option value="cartao">Cartão</option>
          </select>
        </div>
      </div>
      <button class="btn-lancar" onclick="lancarManual()">Lançar Pedido</button>
    </div>

    <!-- TABS -->
    <div class="tabs">
      <button class="tab active" onclick="filtrar('todos', this)">Todos</button>
      <button class="tab" onclick="filtrar('novo', this)">🟡 Novos</button>
      <button class="tab" onclick="filtrar('preparo', this)">🟠 Em Preparo</button>
      <button class="tab" onclick="filtrar('pronto', this)">🟢 Prontos</button>
      <button class="tab" onclick="filtrar('entregue', this)">✅ Entregues</button>
    </div>

    <!-- LISTA DE PEDIDOS -->
    <div class="pedidos-grid" id="pedidos-grid">
      <p class="vazio">Carregando pedidos...</p>
    </div>
  </div>
</div>

<script>
  let SENHA = '';
  let pedidos = [];
  let filtroAtual = 'todos';
  let ultimoId = null;
  let intervalo = null;

  // ── LOGIN ─────────────────────────────────────────────────
  function entrar() {
    const s = document.getElementById('senha-input').value.trim();
    if (!s) return;
    SENHA = s;
    carregarPedidos(true);
  }

  function sair() {
    SENHA = '';
    clearInterval(intervalo);
    document.getElementById('painel-screen').style.display = 'none';
    document.getElementById('login-screen').style.display = 'flex';
    document.getElementById('senha-input').value = '';
  }

  // ── CARREGAR PEDIDOS ──────────────────────────────────────
  async function carregarPedidos(primeiro = false) {
    try {
      const res = await fetch('/api/pedidos', {
        headers: { 'x-painel-senha': SENHA }
      });

      if (res.status === 401) {
        document.getElementById('login-erro').textContent = 'Senha incorreta';
        return;
      }

      if (primeiro) {
        document.getElementById('login-screen').style.display = 'none';
        document.getElementById('painel-screen').style.display = 'block';
        document.getElementById('login-erro').textContent = '';
        // Polling a cada 8 segundos
        intervalo = setInterval(() => carregarPedidos(), 8000);
      }

      const novos = await res.json();

      // Verifica se chegou pedido novo
      if (!primeiro && pedidos.length > 0 && novos.length > 0) {
        const maisNovoAntes = pedidos[0]?.id;
        const maisNovoAgora = novos[0]?.id;
        if (maisNovoAgora !== maisNovoAntes) {
          tocarAlerta();
        }
      }

      pedidos = novos;
      renderPedidos();
      atualizarBadge();

    } catch (err) {
      console.error('Erro:', err);
    }
  }

  // ── RENDER ────────────────────────────────────────────────
  function renderPedidos() {
    const grid = document.getElementById('pedidos-grid');
    const lista = filtroAtual === 'todos'
      ? pedidos
      : pedidos.filter(p => p.status === filtroAtual);

    if (lista.length === 0) {
      grid.innerHTML = '<p class="vazio">Nenhum pedido aqui ainda 🥟</p>';
      return;
    }

    grid.innerHTML = lista.map(p => {
      const itens = JSON.parse(p.itens || '[]');
      const hora  = new Date(p.criado_em).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
      const data  = new Date(p.criado_em).toLocaleDateString('pt-BR');
      const end   = p.endereco_rua
        ? `${p.endereco_rua}, ${p.endereco_numero}${p.endereco_complemento ? ', ' + p.endereco_complemento : ''} — ${p.endereco_bairro}`
        : '(sem endereço — WhatsApp)';

      const itensHTML = itens.map(i =>
        `<div class="card-item">• ${i.qty ? i.qty + 'x ' : ''}${i.nome}${i.preco ? ' — R$ ' + (i.preco * (i.qty||1)).toFixed(2).replace('.',',') : ''}</div>`
      ).join('');

      const pagLabel = { pix: '💠 Pix', dinheiro: '💵 Dinheiro', cartao: '💳 Cartão' }[p.pagamento] || p.pagamento;

      return `
        <div class="pedido-card ${p.status}" id="card-${p.id}">
          <div class="card-header">
            <div>
              <span class="card-id">#${p.id}</span>
              <span class="status-badge status-${p.status}" style="margin-left:6px">
                ${{ novo:'🟡 Novo', preparo:'🟠 Preparo', pronto:'🟢 Pronto', entregue:'✅ Entregue' }[p.status] || p.status}
              </span>
            </div>
            <div style="text-align:right">
              <div class="card-hora">${hora} · ${data}</div>
              <span class="card-origem ${p.origem === 'whatsapp' ? 'whatsapp' : ''}">${p.origem === 'whatsapp' ? '📱 WhatsApp' : '🌐 Site'}</span>
            </div>
          </div>
          <div class="card-body">
            <div class="card-cliente">${p.cliente_nome}</div>
            <div class="card-tel">${p.cliente_telefone || ''}</div>
            <div class="card-end">📍 ${end}</div>
            <div class="card-itens">${itensHTML}</div>
            <div class="card-total">R$ ${parseFloat(p.total).toFixed(2).replace('.',',')}</div>
            <div class="card-pag">${pagLabel}</div>
            <div class="card-acoes">
              ${p.status === 'novo'     ? `<button class="btn-status btn-preparo"  onclick="mudarStatus('${p.id}','preparo')">Em Preparo</button>` : ''}
              ${p.status === 'preparo'  ? `<button class="btn-status btn-pronto"   onclick="mudarStatus('${p.id}','pronto')">Pronto</button>` : ''}
              ${p.status === 'pronto'   ? `<button class="btn-status btn-entregue" onclick="mudarStatus('${p.id}','entregue')">Entregue</button>` : ''}
              <button class="btn-status btn-imprimir" onclick="imprimirPedido(${JSON.stringify(p).replace(/"/g,'&quot;')})">🖨️ Imprimir</button>
            </div>
          </div>
        </div>`;
    }).join('');
  }

  // ── FILTRO ────────────────────────────────────────────────
  function filtrar(status, btn) {
    filtroAtual = status;
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    btn.classList.add('active');
    renderPedidos();
  }

  // ── BADGE ─────────────────────────────────────────────────
  function atualizarBadge() {
    const n = pedidos.filter(p => p.status === 'novo').length;
    document.getElementById('badge-novos').textContent = n + (n === 1 ? ' novo' : ' novos');
  }

  // ── MUDAR STATUS ──────────────────────────────────────────
  async function mudarStatus(id, status) {
    await fetch(`/api/pedido/${id}`, {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json', 'x-painel-senha': SENHA },
      body: JSON.stringify({ status })
    });
    await carregarPedidos();
  }

  // ── LANÇAR MANUAL ─────────────────────────────────────────
  async function lancarManual() {
    const nome   = document.getElementById('m-nome').value.trim();
    const tel    = document.getElementById('m-tel').value.trim();
    const itens  = document.getElementById('m-itens').value.trim();
    const total  = document.getElementById('m-total').value;
    const pag    = document.getElementById('m-pag').value;

    if (!nome || !itens || !total) {
      alert('Preencha nome, itens e total!');
      return;
    }

    await fetch('/api/pedido-manual', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-painel-senha': SENHA },
      body: JSON.stringify({ cliente_nome: nome, cliente_telefone: tel, itens_texto: itens, total, pagamento: pag })
    });

    document.getElementById('m-nome').value  = '';
    document.getElementById('m-tel').value   = '';
    document.getElementById('m-itens').value = '';
    document.getElementById('m-total').value = '';
    await carregarPedidos();
  }

  // ── ALERTA SONORO ─────────────────────────────────────────
  function tocarAlerta() {
    const banner = document.getElementById('alerta-banner');
    banner.style.display = 'block';
    setTimeout(() => banner.style.display = 'none', 5000);

    try {
      const ctx = new AudioContext();
      [523, 659, 784].forEach((freq, i) => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain); gain.connect(ctx.destination);
        osc.frequency.value = freq;
        osc.type = 'sine';
        gain.gain.setValueAtTime(0.3, ctx.currentTime + i * 0.15);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + i * 0.15 + 0.3);
        osc.start(ctx.currentTime + i * 0.15);
        osc.stop(ctx.currentTime + i * 0.15 + 0.3);
      });
    } catch(e) {}
  }

  // ── IMPRESSÃO TÉRMICA ─────────────────────────────────────
  function imprimirPedido(p) {
    const itens  = JSON.parse(p.itens || '[]');
    const hora   = new Date(p.criado_em).toLocaleString('pt-BR');
    const pagLabel = { pix: 'PIX', dinheiro: 'Dinheiro', cartao: 'Cartao' }[p.pagamento] || p.pagamento;
    const end    = p.endereco_rua
      ? `${p.endereco_rua}, ${p.endereco_numero}${p.endereco_complemento ? ', ' + p.endereco_complemento : ''}\n${p.endereco_bairro} - ${p.endereco_cidade}\nCEP ${p.endereco_cep}`
      : 'Pedido via WhatsApp';

    const itensTexto = itens.map(i =>
      `${i.qty ? i.qty + 'x ' : ''}${i.nome}`.padEnd(24) + `R$ ${(i.preco * (i.qty||1)).toFixed(2).replace('.',',')}`
    ).join('\n');

    const linha = '--------------------------------';

    document.getElementById('print-area').innerHTML = `
      <div style="font-family:monospace;font-size:12px;width:80mm;color:black;background:white;padding:8px">
        <div style="text-align:center;font-size:15px;font-weight:bold">PASTEL DA VILA</div>
        <div style="text-align:center;font-size:11px">Delivery</div>
        <div style="text-align:center">${linha}</div>
        <div>Pedido: #${p.id}</div>
        <div>${hora}</div>
        <div>Origem: ${p.origem === 'whatsapp' ? 'WhatsApp' : 'Site'}</div>
        <div>${linha}</div>
        <div style="font-weight:bold">CLIENTE</div>
        <div>${p.cliente_nome}</div>
        <div>${p.cliente_telefone || ''}</div>
        <div>${linha}</div>
        <div style="font-weight:bold">ENTREGA</div>
        <div style="white-space:pre">${end}</div>
        <div>${linha}</div>
        <div style="font-weight:bold">ITENS</div>
        <div style="white-space:pre">${itensTexto}</div>
        <div>${linha}</div>
        <div style="font-weight:bold;font-size:14px">TOTAL: R$ ${parseFloat(p.total).toFixed(2).replace('.',',')}</div>
        <div>Pagamento: ${pagLabel}</div>
        <div>${linha}</div>
        <div style="text-align:center;font-size:10px">Obrigado pela preferencia!</div>
        <div style="text-align:center;font-size:10px">Pastel da Vila - Rolandia</div>
      </div>`;

    document.getElementById('print-area').style.display = 'block';
    window.print();
    document.getElementById('print-area').style.display = 'none';
  }
</script>
</body>
</html>
